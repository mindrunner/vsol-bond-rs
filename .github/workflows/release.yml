name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package binary and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          asset="vsol-bond-rs-${TAG}-x86_64-unknown-linux-gnu"
          install -Dm755 target/x86_64-unknown-linux-gnu/release/vsol-bond-rs "dist/${asset}/vsol-bond-rs"
          install -Dm644 README.md "dist/${asset}/README.md"
          install -Dm644 LICENSE "dist/${asset}/LICENSE"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          cd dist
          sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
